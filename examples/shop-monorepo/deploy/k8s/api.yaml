apiVersion: apps/v1
kind: Deployment
metadata: { name: orders-api, namespace: shop }
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: api
          image: ghcr.io/acme/orders-api:1.4.0
          ports: [{ containerPort: 8080 }]
          env: [{ name: DATABASE_URL }, { name: REDIS_URL }, { name: KAFKA_BROKERS }]
---
apiVersion: v1
kind: Service
metadata: { name: orders-api, namespace: shop }
spec:
  selector: { app: orders-api }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: shop, namespace: shop }
spec:
  rules:
    - host: shop.example.com
      http:
        paths:
          - { path: /api, pathType: Prefix, backend: { service: { name: orders-api, port: { number: 80 } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: api-from-ingress, namespace: shop }
spec:
  podSelector: { matchLabels: { app: orders-api } }
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { name: ingress-nginx } } }, { podSelector: { matchLabels: { app: web } } }]
