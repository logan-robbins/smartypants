name: Publish to npm

# Runs when a vX.Y.Z tag is pushed, when a GitHub release is published, or by hand.
# (A release for an already-published version fails harmlessly: npm refuses duplicates.)
# First publish: add an npm automation token as the NPM_TOKEN repository secret.
# After that, npm trusted publishing (this repo + this workflow) can replace the token.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - name: Tag matches package.json
        if: github.event_name != 'workflow_dispatch'
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./package.json").version')"
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
