apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
spec:
  template:
    spec:
      containers:
        - name: orders
          image: ghcr.io/acme/orders:2.1
---
apiVersion: v1
kind: Service
metadata: [this is: not, valid
  name: broken
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orders-from-gateway
  namespace: shop
spec:
  podSelector:
    matchLabels: { app: orders }
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: gateway }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: public
  namespace: shop
spec:
  rules:
    - host: api.example.com
      http:
        paths:
          - path: /orders
            backend:
              service:
                name: orders
---
apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: orders-config
