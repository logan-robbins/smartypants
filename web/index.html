<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%224%22 y=%223%22 width=%2224%22 height=%228%22 rx=%224%22 fill=%22%239370db%22/%3E%3Crect x=%224%22 y=%2213%22 width=%2210%22 height=%227%22 rx=%222%22 fill=%22%23ececff%22 stroke=%22%239370db%22/%3E%3Crect x=%2218%22 y=%2213%22 width=%2210%22 height=%227%22 rx=%222%22 fill=%22%23ececff%22 stroke=%22%239370db%22/%3E%3Cellipse cx=%2216%22 cy=%2225%22 rx=%228%22 ry=%224%22 fill=%22%23fff8dc%22 stroke=%22%23c9a227%22/%3E%3C/svg%3E" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Smartypants</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <p id="boot">Opening the design canvas…</p>
  <template id="serve-help-template">
    <main class="serve-help">
      <div>
        <h1>Smartypants canvas</h1>
        <p>This page reads the persisted design from the project, so open it through the local server.</p>
        <p>From the project root, run <code>node bin/smartypants-serve.mjs</code></p>
        <p>Then open <code>http://127.0.0.1:4173</code></p>
      </div>
    </main>
  </template>
  <script>
    (function () {
      if (location.protocol !== "file:") return;
      document.addEventListener("DOMContentLoaded", function () {
        var template = document.getElementById("serve-help-template");
        if (!template) return;
        document.body.innerHTML = template.innerHTML;
      });
    })();
  </script>
  <script src="scene.cjs"></script>
  <script src="app.js"></script>
</body>
</html>
